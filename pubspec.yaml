name: the_bartender
description: Become your own bartender with the ingredients you already have!

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.3+10

environment:
  sdk: ^3.1.1


dependencies:
  flutter:
    sdk: flutter

  english_words: ^4.0.0
  provider: ^6.0.0
  in_app_purchase: ^3.1.13
  firebase_core: ^2.25.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
  - assets/Cocktail Images/
  - assets/fonts/
  fonts:
  - family: Shackle
    fonts:
    - asset: assets/fonts/ShackleRegular.ttf
    - asset: assets/fonts/ShackleItalic.ttf
      style: italic